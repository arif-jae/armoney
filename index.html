<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#0f766e"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<title>สมุดรายรับรายจ่าย</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef3f1;--card:#fff;--fg:#14211c;--mut:#5d6f68;--line:#d5dfdb;--acc:#0f766e;--accfg:#fff;--inc:#16794a;--exp:#b4232c;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1714;--card:#17231f;--fg:#e6efeb;--mut:#92a69e;--line:#2a3a35;--acc:#34c3b3;--accfg:#06201c;--inc:#5fd391;--exp:#ff8b92;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1714;--card:#17231f;--fg:#e6efeb;--mut:#92a69e;--line:#2a3a35;--acc:#34c3b3;--accfg:#06201c;--inc:#5fd391;--exp:#ff8b92;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:400 16px/1.5 "IBM Plex Sans Thai","Noto Sans Thai",Tahoma,sans-serif;font-variant-numeric:tabular-nums}
#app{max-width:560px;margin:0 auto;padding:0 14px 150px}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 0 6px}
header b{font-size:18px;font-weight:600}
header.off{display:none}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
.ib{background:var(--card);border:1px solid var(--line);border-radius:10px;width:40px;height:40px;font-size:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin:10px 0}
h2{font-size:20px;margin:16px 0 4px;font-weight:600}
h4{margin:16px 0 6px;font-size:14px;font-weight:500;color:var(--mut)}
.mut{color:var(--mut)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:10px 0}
.seg button{padding:10px;border:1px solid var(--line);background:var(--card);border-radius:10px;font-weight:500}
.seg button.on{background:var(--acc);color:var(--accfg);border-color:var(--acc)}
label{display:block;font-size:14px;color:var(--mut);margin:12px 0 4px}
input,select{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
#amt{font-size:30px;font-weight:600;padding:12px}
.go{width:100%;margin-top:16px;padding:14px;border:0;border-radius:12px;background:var(--acc);color:var(--accfg);font-weight:600;font-size:17px}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .t{flex:1;min-width:0}
.row .t span{display:block;font-size:13px;color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.amt{font-weight:600;white-space:nowrap}
.i{color:var(--inc)}.e{color:var(--exp)}
.x{border:0;background:none;color:var(--mut);padding:6px;border-radius:8px}
.x.arm{color:var(--exp);font-weight:600}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stats div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px}
.stats small{display:block;color:var(--mut);font-size:13px}
.stats b{font-size:17px}
.bar{height:8px;border-radius:4px;background:var(--line);margin-top:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc)}
.sp{display:flex;justify-content:space-between;gap:8px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;background:var(--card);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;max-width:130px;border:0;background:none;padding:6px 0;font-size:13px;color:var(--mut);border-radius:10px}
nav button b{display:flex;align-items:center;justify-content:center;width:56px;height:30px;margin:0 auto 2px;border-radius:15px;transition:background .2s}
nav button.on b{background:color-mix(in srgb,currentColor 20%,transparent)}
nav button.on{color:var(--acc);font-weight:600}
.bi{fill:var(--inc)}.be{fill:var(--exp)}.ln{stroke:var(--acc);fill:none;stroke-width:2}.ax{stroke:var(--line);stroke-width:1}.av{stroke:var(--acc);stroke-width:1.5;stroke-dasharray:4 3}.tx{fill:var(--mut);font-size:9px}
.stats button{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:left;display:block}
#fm{position:fixed;right:14px;bottom:calc(142px + env(safe-area-inset-bottom,0px));z-index:4;display:flex;flex-direction:column-reverse;gap:10px;align-items:flex-end}
#fm[hidden],#fs[hidden]{display:none}
.fi{background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:24px;padding:12px 20px;font-weight:600;font-size:16px;box-shadow:0 3px 10px rgba(0,0,0,.25)}
#fs{position:fixed;inset:0;z-index:3;background:rgba(0,0,0,.25)}
#fab{display:grid;place-items:center;transition:transform .2s}
.fic{width:28px;height:28px;border-radius:50%;display:inline-grid;place-items:center;margin-right:10px;vertical-align:middle;color:#fff}#fab.on{transform:rotate(45deg)}
#fab{position:fixed;right:14px;bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:4;background:var(--acc);color:var(--accfg);border:0;border-radius:50%;width:56px;height:56px;padding:0;font-weight:400;font-size:32px;line-height:1;box-shadow:0 4px 14px rgba(0,0,0,.3)}
#ok{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%) scale(.9);z-index:20;background:var(--card);border:2px solid var(--inc);border-radius:16px;padding:20px 28px;text-align:center;min-width:230px;box-shadow:0 8px 30px rgba(0,0,0,.25);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
#ok.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
#ok b{display:block;font-size:44px;line-height:1;color:var(--inc)}
#ok span{display:block;margin-top:6px;font-weight:600;font-size:18px}
#ok small{color:var(--mut);font-size:15px}
#toast{z-index:10;position:fixed;left:50%;bottom:140px;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:20px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}
textarea{width:100%;height:110px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--fg);padding:8px;font:12px monospace}
details summary{cursor:pointer;font-weight:500}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sm{padding:10px 12px;border:1px solid var(--line);background:var(--card);border-radius:10px;margin-top:8px}
.row .t span.nt{white-space:normal}
.ic{width:1.4em;height:1.4em;border-radius:6px;object-fit:cover;vertical-align:-.3em}
.mdl{position:fixed;inset:0;z-index:5;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:14px}.mdl[hidden]{display:none}.mdl .card{width:100%;max-width:520px;max-height:90vh;overflow:auto;margin:0}
</style>
</head>
<body>
<div id="app">
<header id="hd"><button class="ib" data-a="m" data-k="-1" aria-label="เดือนก่อน">‹</button><b id="mt"></b><button class="ib" data-a="m" data-k="1" aria-label="เดือนถัดไป">›</button></header>
<main id="v"></main>
</div>
<nav id="nav"></nav>
<div id="toast" role="status"></div>
<div id="ok" role="status" aria-live="polite"></div>
<div class="mdl" id="tm" hidden></div>
<div class="mdl" id="cm" hidden></div>
<div id="fs" hidden data-a="fclose"></div><div id="fm" hidden></div><button id="fab" data-a="fab" aria-label="เพิ่ม" aria-expanded="false"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
<script>
var K='moneyapp.v1';
var G=[{id:1,n:'เงินสด',l:0,e:'💵'},{id:2,n:'เงินฝากธนาคาร',l:0,e:'🏦'},{id:3,n:'เงินออนไลน์',l:0,e:'📱'},{id:5,n:'สหกรณ์ออมทรัพย์',l:0,e:'🤝'},{id:7,n:'ลูกหนี้',l:0,e:'🤲'},{id:4,n:'หนี้สิน',l:1,e:'💳'}];
function seed(){return{n:100,accs:[{id:1,n:'กระเป๋าสตางค์',g:1,i:0},{id:2,n:'บัญชีธนาคาร',g:2,i:0},{id:3,n:'บัตรเครดิต',g:4,i:0}],
cats:[[1,'รายรับจากอาชีพ','i','💼'],[2,'รายรับอื่นๆ','i','🎁'],[3,'ดอกเบี้ยเงินฝาก','i','🏦'],[4,'ใช้จ่ายในอาชีพ','e','🛠️'],[5,'ที่อยู่อาศัย','e','🏠'],[6,'อาหาร/เครื่องดื่ม','e','🍜'],[7,'เดินทาง','e','🚌'],[8,'ของใช้ประจำวัน','e','🧴'],[9,'เสื้อผ้า/แต่งกาย','e','👕'],[10,'สาธารณูปโภค','e','💡'],[11,'รักษาพยาบาล','e','💊'],[12,'สันทนาการ/สังคม','e','🎉'],[13,'ครอบครัว','e','👪'],[14,'สัตว์เลี้ยง','e','🐾'],[15,'ค่าธรรมเนียม','e','🧾'],[16,'เก็บออม','e','🐷']].map(function(c){return{id:c[0],n:c[1],t:c[2],e:c[3]}}),tx:[]}}
var S=null;try{S=JSON.parse(localStorage.getItem(K))}catch(e){}
if(!S||!S.accs||!S.cats||!S.tx)S=seed();
S.accs.forEach(function(a){if(a.g==6)a.g=5});
function save(){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}}
function $(i){return document.getElementById(i)}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
var nf=new Intl.NumberFormat('th-TH',{minimumFractionDigits:2,maximumFractionDigits:2});
function fmt(n){return nf.format(n)}
function iso(d){return new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)}
var today=iso(new Date()),ym=today.slice(0,7),view='sum',st='e',ft=2,armed=0,eid=0,etx=0,dr={amt:'',dt:today,ac:'',nt:''};
function acc(i){return S.accs.filter(function(a){return a.id==i})[0]||{n:'(ไม่พบบัญชี)',g:1,i:0}}
function cat(i){return S.cats.filter(function(c){return c.id==i})[0]||{n:'(ไม่พบหมวด)',e:'•'}}
function aic(a){return a.e||G.filter(function(g){return g.id==a.g})[0].e}
function ico(o){return o.g?aic(o):o.e}
function ih(o){return o.img?'<img class="ic" alt="" src="'+o.img+'">':esc(ico(o)||'')}
var pimg,ecur;
function pv(k){var s=pimg===undefined?(ecur&&ecur.img):pimg;$(k).innerHTML=s?'<img class="ic" style="width:48px;height:48px;margin-top:8px" alt="" src="'+s+'"> <button class="x" data-a="rmimg" data-k="'+k+'">ลบรูป</button>':''}
function isL(a){return G.filter(function(g){return g.id==a.g})[0].l==1}
function bal(a){var d=0;S.tx.forEach(function(x){if(x.t==1&&x.a==a.id)d+=x.amt;else if(x.t==2&&x.a==a.id)d-=x.amt;else if(x.t==3){if(x.a==a.id)d-=x.amt;if(x.to==a.id)d+=x.amt}});return isL(a)?a.i-d:a.i+d}
function toast(m){var t=$('toast');t.textContent=m;t.className='on';clearTimeout(toast.h);toast.h=setTimeout(function(){t.className=''},1800)}
function okmsg(t,d){var o=$('ok');o.innerHTML='<b>✓</b><span>'+esc(t)+'</span><small>'+esc(d)+'</small>';o.className='on';try{navigator.vibrate&&navigator.vibrate(60)}catch(e){}clearTimeout(okmsg.h);okmsg.h=setTimeout(function(){o.className=''},2200)}
function dth(d){return new Date(d+'T00:00:00').toLocaleDateString('th-TH',{weekday:'short',day:'numeric',month:'short'})}
function opts(list,sel){return list.map(function(o){return'<option value="'+o.id+'"'+(o.id==sel?' selected':'')+'>'+esc((ico(o)?ico(o)+' ':'')+o.n)+'</option>'}).join('')}
function snap(){if($('amt'))dr={amt:$('amt').value,dt:$('dt').value,ac:$('ac').value,nt:$('nt').value}}
function vAdd(){
 if(!dr.ac)dr.ac=S.accs[0].id;
 var seg=[[2,'รายจ่าย'],[1,'รายรับ'],[3,'โอนเงิน']].map(function(p){return'<button data-a="ft" data-k="'+p[0]+'" class="'+(ft==p[0]?'on':'')+'">'+p[1]+'</button>'}).join('');
 var second=ft==3?'<label for="to">ไปยังบัญชี</label><select id="to">'+opts(S.accs,dr.to)+'</select>':'<label for="cat">หมวดหมู่</label><select id="cat">'+opts(S.cats.filter(function(c){return c.t==(ft==1?'i':'e')}),dr.cat)+'</select>';
 return'<div class="card"><div class="sp"><h2 style="margin:0">'+(etx?'แก้ไขรายการ':'เพิ่มรายการ')+'</h2><button class="x" data-a="close" aria-label="ปิด">✕</button></div><div class="seg">'+seg+'</div><label for="amt">จำนวนเงิน (บาท)</label><input id="amt" inputmode="decimal" placeholder="0.00" value="'+esc(dr.amt)+'">'
 +'<label for="ac">'+(ft==3?'จากบัญชี':'บัญชี')+'</label><select id="ac">'+opts(S.accs,dr.ac)+'</select>'+second
 +'<label for="nt">บันทึกช่วยจำ</label><input id="nt" placeholder="เช่น ข้าวกลางวัน" value="'+esc(dr.nt)+'">'
 +'<label for="dt">วันที่</label><input id="dt" type="date" value="'+esc(dr.dt)+'"><button class="go" data-a="add">'+(etx?'บันทึกการแก้ไข':'บันทึก')+'</button></div>'}
function fillTm(){var t=$('tm');t.innerHTML=vAdd();t.hidden=false}
function tclose(){var t=$('tm');t.hidden=true;t.innerHTML=''}
function monthTx(){return S.tx.filter(function(x){return x.d.slice(0,7)==ym})}
function vList(){
 var xs=monthTx().sort(function(a,b){return b.d.localeCompare(a.d)||b.id-a.id});
 if(!xs.length)return'<p class="mut">ยังไม่มีรายการในเดือนนี้ กดปุ่ม + เพิ่มรายการ เพื่อเพิ่มรายการแรก</p>';
 var h='<div class="card">',last='';
 xs.forEach(function(x){
  if(x.d!=last){last=x.d;h+='<h4>'+dth(x.d)+'</h4>'}
  var ttl=x.t==3?'🔁 โอน → '+esc(acc(x.to).n):ih(cat(x.c))+' '+esc(cat(x.c).n);
  var cls=x.t==1?'i':x.t==2?'e':'',sg=x.t==1?'+':x.t==2?'−':'';
  h+='<div class="row"><div class="t">'+ttl+'<span>'+ih(acc(x.a))+' '+esc(acc(x.a).n)+(x.n?' · '+esc(x.n):'')+'</span></div><div class="amt '+cls+'">'+sg+fmt(x.amt)+'</div><button class="x" data-a="etx" data-k="'+x.id+'" aria-label="แก้ไข">✎</button><button class="x'+(armed==x.id?' arm':'')+'" data-a="del" data-k="'+x.id+'" aria-label="ลบ">'+(armed==x.id?'ลบ?':'✕')+'</button></div>'});
 return h+'</div>'}
function vSum(){
 var dm=new Date(+ym.slice(0,4),+ym.slice(5,7),0).getDate(),inc=0,exp=0,by={},bi={};
 monthTx().forEach(function(x){if(x.t==1){inc+=x.amt;bi[x.c]=(bi[x.c]||0)+x.amt}if(x.t==2){exp+=x.amt;by[x.c]=(by[x.c]||0)+x.amt}});
 var h='<h2>สรุปเดือนนี้</h2><p class="mut" style="margin:0 0 8px;font-size:13px">แตะการ์ดเพื่อดูแผนภูมิโดนัท</p><div class="stats"><button data-a="chart" data-k="i"><small>รายรับ</small><b class="i">'+fmt(inc)+'</b><small>฿'+fmt(inc/dm)+'/วัน</small></button><button data-a="chart" data-k="e"><small>รายจ่าย</small><b class="e">'+fmt(exp)+'</b><small>฿'+fmt(exp/dm)+'/วัน</small></button><button data-a="chart" data-k="n"><small>คงเหลือ</small><b class="'+(inc-exp<0?'e':'i')+'">'+fmt(inc-exp)+'</b><small>฿'+fmt((inc-exp)/dm)+'/วัน</small></button></div>';
 var ex=st=='e',src=ex?by:bi,tot=ex?exp:inc,ks=Object.keys(src).sort(function(a,b){return src[b]-src[a]});
 h+='<div class="seg" style="grid-template-columns:1fr 1fr">'+[['e','รายจ่าย'],['i','รายรับ']].map(function(p){return'<button data-a="st" data-k="'+p[0]+'" class="'+(st==p[0]?'on':'')+'">'+p[1]+'</button>'}).join('')+'</div><div class="card">';
 if(!ks.length)h+='<span class="mut">ยังไม่มี'+(ex?'รายจ่าย':'รายรับ')+'ในเดือนนี้</span>';
 ks.forEach(function(k){var p=Math.round(src[k]/tot*100);h+='<div style="margin:8px 0"><div class="sp"><span>'+ih(cat(k))+' '+esc(cat(k).n)+'</span><span>'+fmt(src[k])+' <span class="mut">('+p+'%)</span></span></div><div class="bar"><i style="width:'+p+'%"></i></div></div>'});
 return h+'</div>'}
var NC={sum:'#3b82f6',list:'#f08c00',acc:'#8b5cf6'};
var IC={sum:'<path d="M21 12A9 9 0 1 1 12 3"/><path d="M12 3v9h9"/>',list:'<path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1" fill="currentColor"/><circle cx="4.5" cy="12" r="1" fill="currentColor"/><circle cx="4.5" cy="18" r="1" fill="currentColor"/>',acc:'<path d="M4 7h13a3 3 0 0 1 3 3v8a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"/><path d="M4 7V6a2 2 0 0 1 2-2h10"/><path d="M16 14h4"/>',wad:'<path d="M4 7h13a3 3 0 0 1 3 3v8a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"/><path d="M4 7V6a2 2 0 0 1 2-2h10"/><path d="M11 11v6M8 14h6"/>',tag:'<path d="M3 4h8.5l9 9a2 2 0 0 1 0 2.8l-5.7 5.7a2 2 0 0 1-2.8 0L3 12.5z"/><circle cx="7.5" cy="8.5" r="1.3"/>',out:'<path d="M7 17L17 7M9 7h8v8"/>',in:'<path d="M17 7L7 17M15 17H7V9"/>',swap:'<path d="M5 8h13l-3-3M19 16H6l3 3"/>'};
function sv(p,w){w=w||24;return'<svg width="'+w+'" height="'+w+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+p+'</svg>'}
var fo=false;
function fmenu(){var m=$('fm'),f=$('fab'),a=view=='acc',its=a?[['m-acc','เพิ่มบัญชี','wad','#8b5cf6'],['m-cat','เพิ่มหมวดหมู่','tag','#f08c00']]:[[2,'รายจ่าย','out','#e5484d'],[1,'รายรับ','in','#2fa866'],[3,'โอนเงิน','swap','#3b82f6']];
 m.innerHTML=its.map(function(p){return'<button class="fi" data-a="'+(a?'fopen':'newt')+'" data-k="'+p[0]+'"><span class="fic" style="background:'+p[3]+'">'+sv(IC[p[2]],16)+'</span>'+p[1]+'</button>'}).join('');
 m.hidden=$('fs').hidden=!fo;f.className=fo?'on':'';f.setAttribute('aria-expanded',fo?'true':'false')}
var CH;
function cdraw(){if(!$('c1')||!CH)return;var z=CH.ps[CH.sel],set=function(i,t){$('c'+i).textContent=t};
 if(z){set(1,z.n.length>12?z.n.slice(0,11)+'…':z.n);set(2,(z.v/CH.tot*100).toFixed(1)+'%');set(3,'฿'+fmt(z.v))}else{set(1,CH.k=='n'?'คงเหลือ':'รวม');set(2,'฿'+fmt(CH.T));set(3,'')}
 $('c2').style.fontSize=z?'26px':'16px';
 var q=document.querySelectorAll('#cm [data-a="sl"]');for(var i=0;i<q.length;i++)q[i].style.opacity=(CH.sel<0||CH.sel==+q[i].dataset.k)?1:.35}
var PC=['#2a9d8f','#e76f51','#4c78d8','#e9c46a','#9b5de5','#5fb760','#f15bb5','#00a6d6','#b5651d','#7a8b99','#d62839','#6a994e'];
function vChart(kind){
 var dm=new Date(+ym.slice(0,4),+ym.slice(5,7),0).getDate(),inc=0,exp=0,bi={},be={},nm={i:'รายรับ',e:'รายจ่าย',n:'คงเหลือ'}[kind],sl,tot;
 monthTx().forEach(function(x){if(x.t==1){inc+=x.amt;bi[x.c]=(bi[x.c]||0)+x.amt}if(x.t==2){exp+=x.amt;be[x.c]=(be[x.c]||0)+x.amt}});
 if(kind=='n'){sl=[{n:'รายรับ',v:inc,c:'var(--inc)'},{n:'รายจ่าย',v:exp,c:'var(--exp)'}];tot=inc+exp}
 else{var src=kind=='i'?bi:be;tot=kind=='i'?inc:exp;sl=Object.keys(src).sort(function(a,b){return src[b]-src[a]}).map(function(k,j){return{n:cat(k).n,ic:ih(cat(k)),v:src[k],c:PC[j%PC.length]}})}
 var hd='<div class="card"><div class="sp"><h2 style="margin:0">'+nm+'</h2><button class="x" data-a="close" aria-label="ปิด">✕</button></div><p class="mut" style="margin:4px 0">'+esc($('mt').textContent)+'</p>';
 if(!(tot>0))return hd+'<p class="mut">ยังไม่มีข้อมูลในเดือนนี้</p></div>';
var ps=sl.filter(function(z){return z.v>0}),R=74,C=2*Math.PI*R,off=0,T=kind=='n'?inc-exp:tot;
 CH={ps:ps,tot:tot,T:T,k:kind,sel:-1};
 var svg='<svg viewBox="0 0 200 200" width="230" height="230" style="display:block;margin:8px auto" role="img" aria-label="แผนภูมิโดนัท'+nm+' แตะเพื่อดูเปอร์เซ็นต์">';
 ps.forEach(function(z,j){var len=z.v/tot*C,g=ps.length>1?Math.min(2,len/3):0;svg+='<circle data-a="sl" data-k="'+j+'" cx="100" cy="100" r="'+R+'" transform="rotate(-90 100 100)" style="fill:none;stroke:'+z.c+';stroke-width:36;cursor:pointer" stroke-dasharray="'+(len-g)+' '+(C-len+g)+'" stroke-dashoffset="'+(-off)+'"/>';off+=len});
 svg+='<text id="c1" x="100" y="90" text-anchor="middle" style="fill:var(--mut);font-size:12px"></text><text id="c2" x="100" y="112" text-anchor="middle" style="fill:var(--fg);font-weight:600;font-size:16px"></text><text id="c3" x="100" y="130" text-anchor="middle" style="fill:var(--mut);font-size:12px"></text></svg>';
 var lg='<div>'+ps.map(function(z,j){var p=z.v/tot*100;return'<div class="row" data-a="sl" data-k="'+j+'" style="cursor:pointer"><span style="width:12px;height:12px;border-radius:3px;flex:none;background:'+z.c+'"></span><div class="t">'+(z.ic?z.ic+' ':'')+esc(z.n)+'</div><div class="amt">฿'+fmt(z.v)+' <span class="mut" style="font-weight:400">('+(p<1?'&lt;1':Math.round(p))+'%)</span></div></div>'}).join('')+'</div>';
 var T=kind=='n'?inc-exp:tot;
 return hd+svg+lg+'<div class="sp" style="margin-top:10px"><span class="mut">'+(kind=='n'?'คงเหลือ (รายรับ − รายจ่าย)':'รวม')+'</span><b>฿'+fmt(T)+'</b></div><div class="sp"><span class="mut">เฉลี่ยต่อวัน</span><b>฿'+fmt(T/dm)+'</b></div></div>'}
function catList(){var h='';[['e','หมวดรายจ่าย'],['i','หมวดรายรับ']].forEach(function(p){h+='<h4>'+p[1]+'</h4><div class="card">';S.cats.filter(function(c){return c.t==p[0]}).forEach(function(c){h+='<div class="row"><div class="t">'+ih(c)+' '+esc(c.n)+'</div><button class="x" data-a="edit" data-k="c'+c.id+'" aria-label="แก้ไข">✎</button></div>'});h+='</div>'});return h}
function vAcc(){
 var tot=0,h='';
 G.forEach(function(g){
  var as=S.accs.filter(function(a){return a.g==g.id});if(!as.length)return;
  h+='<h4>'+g.e+' '+g.n+'</h4><div class="card">';
  as.forEach(function(a){var b=bal(a);tot+=g.l?-b:b;h+='<div class="row"><div class="t">'+ih(a)+' '+esc(a.n)+(a.note?'<span class="nt">'+esc(a.note)+'</span>':'')+'</div><div class="amt '+(g.l?'e':'')+'">'+fmt(b)+'</div><button class="x" data-a="edit" data-k="a'+a.id+'" aria-label="แก้ไข">✎</button></div>'});
  h+='</div>'});
 return'<h2>บัญชีของฉัน</h2><div class="stats" style="grid-template-columns:1fr"><div><small>ทรัพย์สินสุทธิ (ทรัพย์สิน − หนี้สิน)</small><b class="'+(tot<0?'e':'i')+'">'+fmt(tot)+'</b></div></div>'+h
 +catList()+'<div class="mdl" id="m-acc" hidden><div class="card"><div class="sp"><h2 style="margin:0">เพิ่มบัญชี</h2><button class="x" data-a="close" aria-label="ปิด">✕</button></div><label for="an">ชื่อบัญชี</label><input id="an"><label for="ae">ไอคอน (อีโมจิ)</label><input id="ae" maxlength="4" placeholder="เว้นว่างเพื่อใช้ไอคอนตามประเภท"><label for="ano">บันทึกข้อความ</label><input id="ano" maxlength="200" placeholder="เช่น เลขบัญชีท้าย 1234 หรือวันครบกำหนดชำระ"><div class="two"><div><label for="ag">ประเภท</label><select id="ag">'+G.map(function(g){return'<option value="'+g.id+'">'+g.n+'</option>'}).join('')+'</select></div><div><label for="ai">ยอดตั้งต้น</label><input id="ai" inputmode="decimal" placeholder="0.00"></div></div><label for="af">หรืออัปโหลดรูป</label><input id="af" type="file" accept="image/*"><div id="ap"></div><button class="go" data-a="addacc">เพิ่มบัญชี</button></div></div>'
 +'<div class="mdl" id="m-cat" hidden><div class="card"><div class="sp"><h2 style="margin:0">เพิ่มหมวดหมู่</h2><button class="x" data-a="close" aria-label="ปิด">✕</button></div><label for="cn">ชื่อหมวด</label><input id="cn"><div class="two"><div><label for="ct">ชนิด</label><select id="ct"><option value="e">รายจ่าย</option><option value="i">รายรับ</option></select></div><div><label for="ce">ไอคอน (อีโมจิ)</label><input id="ce" maxlength="4" placeholder="🍚"></div></div><label for="cf">หรืออัปโหลดรูป</label><input id="cf" type="file" accept="image/*"><div id="cp"></div><button class="go" data-a="addcat">เพิ่มหมวด</button></div></div>'
 +'<details class="card"><summary>สำรองและกู้คืนข้อมูล</summary><p class="mut">ข้อมูลเก็บในเบราว์เซอร์เครื่องนี้ คัดลอกข้อความด้านล่างไปเก็บไว้เพื่อย้ายเครื่องหรือกันข้อมูลหาย</p><textarea id="bk" aria-label="ข้อมูลสำรอง"></textarea><div class="two"><button class="sm" data-a="exp">แสดงข้อมูลสำรอง</button><button class="sm" data-a="imp">นำเข้าข้อมูล</button></div></details>'}
function render(){pimg=undefined;ecur=null;
 $('hd').className=(view=='list'||view=='sum')?'':'off';
 $('mt').textContent=new Date(ym+'-01T00:00:00').toLocaleDateString('th-TH',{month:'long',year:'numeric'});
 $('v').innerHTML={add:vAdd,list:vList,sum:vSum,acc:vAcc}[view]();
 $('nav').innerHTML=[['sum','📊','สรุป'],['list','📋','รายการ'],['acc','🏦','บัญชี']].map(function(p){return'<button data-a="tab" data-k="'+p[0]+'" class="'+(view==p[0]?'on':'')+'"><b style="color:'+NC[p[0]]+'">'+sv(IC[p[0]])+'</b>'+p[2]+'</button>'}).join('')}
function act(a,k){
 if(a=='edit'){var id=+k.slice(1),m=k[0]=='a'?'m-acc':'m-cat';eid=id;
  if(k[0]=='a'){var A=acc(id);$('an').value=A.n;$('ag').value=A.g;$('ai').value=A.i;$('ae').value=A.e||'';$('ano').value=A.note||'';$(m).querySelector('h2').textContent='แก้ไขบัญชี'}
  else{var C=cat(id);$('cn').value=C.n;$('ct').value=C.t;$('ce').value=C.e;$(m).querySelector('h2').textContent='แก้ไขหมวดหมู่'}
  $(m).querySelector('.go').textContent='บันทึกการแก้ไข';ecur=k[0]=='a'?acc(id):cat(id);pv(k[0]=='a'?'ap':'cp');$(m).hidden=false}
 else if(a=='etx'){var x=S.tx.filter(function(y){return y.id==k})[0];etx=x.id;ft=x.t;dr={amt:String(x.amt),dt:x.d,ac:x.a,nt:x.n||'',cat:x.c,to:x.to};armed=0;fillTm()}
 else if(a=='cancel'){etx=0;dr={amt:'',dt:today,ac:'',nt:''};view='list';render()}
 else if(a=='chart'){$('cm').innerHTML=vChart(k);$('cm').hidden=false;cdraw()}
 else if(a=='sl'){CH.sel=CH.sel==k?-1:+k;cdraw()}
 else if(a=='st'){st=k;render()}
 else if(a=='fab'){fo=!fo;fmenu()}
 else if(a=='fclose'){fo=false;fmenu()}
 else if(a=='newt'){fo=false;fmenu();etx=0;ft=+k;dr={amt:'',dt:today,ac:dr.ac||'',nt:''};fillTm();$('amt').focus()}
 else if(a=='fopen'){fo=false;fmenu();act('open',k)}
 else if(a=='open'){eid=0;$(k).hidden=false;var f=$(k).querySelector('input');if(f)f.focus()}
 else if(a=='rmimg'){pimg='';pv(k)}
 else if(a=='close'){eid=0;etx=0;tclose();$('cm').hidden=true;render()}
 else if(a=='tab'){fo=false;fmenu();snap();if(etx){etx=0;dr={amt:'',dt:today,ac:'',nt:''}}view=k;armed=0;render()}
 else if(a=='ft'){snap();ft=+k;fillTm()}
 else if(a=='m'){var y=+ym.slice(0,4),m=+ym.slice(5,7)-1+(+k),d=new Date(y,m,1);ym=iso(d).slice(0,7);armed=0;render()}
 else if(a=='del'){if(armed==k){S.tx=S.tx.filter(function(x){return x.id!=k});armed=0;save();toast('ลบรายการแล้ว')}else{armed=+k;setTimeout(function(){if(armed==k){armed=0;render()}},2500)}render()}
 else if(a=='add'){
  var amt=parseFloat(String($('amt').value).replace(/,/g,''));
  if(!(amt>0))return toast('กรุณาใส่จำนวนเงินที่มากกว่า 0');
  var x={id:etx||S.n++,d:$('dt').value||today,t:ft,a:+$('ac').value,amt:amt,n:$('nt').value.trim()};
  if(ft==3){x.to=+$('to').value;if(x.to==x.a)return toast('เลือกบัญชีต้นทางและปลายทางให้ต่างกัน')}else x.c=+$('cat').value;
  if(etx){S.tx=S.tx.map(function(y){return y.id==etx?x:y})}else S.tx.push(x);save();dr.amt='';dr.nt='';dr.dt=x.d;dr.ac=x.a;ym=x.d.slice(0,7);okmsg(etx?'บันทึกการแก้ไขสำเร็จ':'บันทึกสำเร็จ',(x.t==1?'รายรับ ':x.t==2?'รายจ่าย ':'โอนเงิน ')+fmt(x.amt)+' บาท');etx=0;tclose();render()}
 else if(a=='addacc'){var n=$('an').value.trim();if(!n)return toast('กรุณาใส่ชื่อบัญชี');var av={n:n,note:$('ano').value.trim(),e:$('ae').value.trim(),g:+$('ag').value,i:parseFloat($('ai').value)||0};if(pimg!==undefined)av.img=pimg;if(eid)Object.assign(acc(eid),av);else S.accs.push(Object.assign({id:S.n++},av));save();toast(eid?'บันทึกการแก้ไขแล้ว':'เพิ่มบัญชีแล้ว');eid=0;render()}
 else if(a=='addcat'){var c=$('cn').value.trim();if(!c)return toast('กรุณาใส่ชื่อหมวด');var cv={n:c,t:$('ct').value,e:$('ce').value.trim()||'📌'};if(pimg!==undefined)cv.img=pimg;if(eid)Object.assign(cat(eid),cv);else S.cats.push(Object.assign({id:S.n++},cv));save();toast(eid?'บันทึกการแก้ไขแล้ว':'เพิ่มหมวดแล้ว');eid=0;render()}
 else if(a=='exp'){$('bk').value=JSON.stringify(S);$('bk').select()}
 else if(a=='imp'){try{var o=JSON.parse($('bk').value);if(!o.accs||!o.cats||!o.tx)throw 0;S=o;save();toast('นำเข้าข้อมูลแล้ว');render()}catch(e){toast('ข้อมูลไม่ถูกต้อง วางข้อมูลสำรองที่ได้จากแอปนี้')}}}
document.addEventListener('change',function(e){var t=e.target;if(t.id!='af'&&t.id!='cf')return;var f=t.files[0];if(!f)return;var r=new FileReader();r.onload=function(){var im=new Image();im.onload=function(){var c=document.createElement('canvas');c.width=c.height=96;var s=Math.min(im.width,im.height);c.getContext('2d').drawImage(im,(im.width-s)/2,(im.height-s)/2,s,s,0,0,96,96);pimg=c.toDataURL('image/jpeg',.8);pv(t.id=='af'?'ap':'cp')};im.onerror=function(){toast('อ่านไฟล์รูปไม่ได้ ลองใช้ JPG หรือ PNG')};im.src=r.result};r.readAsDataURL(f)});
document.addEventListener('click',function(e){var b=e.target.closest('[data-a]');if(b)act(b.dataset.a,b.dataset.k);else if(e.target.classList.contains('mdl'))act('close')});
render();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(function(){});
</script>
