<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#0f766e"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<title>สมุดรายรับรายจ่าย</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef3f1;--card:#fff;--fg:#14211c;--mut:#5d6f68;--line:#d5dfdb;--acc:#0f766e;--accfg:#fff;--inc:#16794a;--exp:#b4232c;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1714;--card:#17231f;--fg:#e6efeb;--mut:#92a69e;--line:#2a3a35;--acc:#34c3b3;--accfg:#06201c;--inc:#5fd391;--exp:#ff8b92;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1714;--card:#17231f;--fg:#e6efeb;--mut:#92a69e;--line:#2a3a35;--acc:#34c3b3;--accfg:#06201c;--inc:#5fd391;--exp:#ff8b92;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:400 16px/1.5 "IBM Plex Sans Thai","Noto Sans Thai",Tahoma,sans-serif;font-variant-numeric:tabular-nums}
#app{max-width:560px;margin:0 auto;padding:0 14px 96px}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 0 6px}
header b{font-size:18px;font-weight:600}
header.off{display:none}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
.ib{background:var(--card);border:1px solid var(--line);border-radius:10px;width:40px;height:40px;font-size:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin:10px 0}
h2{font-size:20px;margin:16px 0 4px;font-weight:600}
h4{margin:16px 0 6px;font-size:14px;font-weight:500;color:var(--mut)}
.mut{color:var(--mut)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:10px 0}
.seg button{padding:10px;border:1px solid var(--line);background:var(--card);border-radius:10px;font-weight:500}
.seg button.on{background:var(--acc);color:var(--accfg);border-color:var(--acc)}
label{display:block;font-size:14px;color:var(--mut);margin:12px 0 4px}
input,select{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
#amt{font-size:30px;font-weight:600;padding:12px}
.go{width:100%;margin-top:16px;padding:14px;border:0;border-radius:12px;background:var(--acc);color:var(--accfg);font-weight:600;font-size:17px}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .t{flex:1;min-width:0}
.row .t span{display:block;font-size:13px;color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.amt{font-weight:600;white-space:nowrap}
.i{color:var(--inc)}.e{color:var(--exp)}
.x{border:0;background:none;color:var(--mut);padding:6px;border-radius:8px}
.x.arm{color:var(--exp);font-weight:600}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stats div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px}
.stats small{display:block;color:var(--mut);font-size:13px}
.stats b{font-size:17px}
.bar{height:8px;border-radius:4px;background:var(--line);margin-top:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc)}
.sp{display:flex;justify-content:space-between;gap:8px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;background:var(--card);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;max-width:130px;border:0;background:none;padding:6px 0;font-size:13px;color:var(--mut);border-radius:10px}
nav button b{display:block;font-size:20px;font-weight:400}
nav button.on{color:var(--acc);font-weight:600}
#toast{z-index:10;position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:20px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}
textarea{width:100%;height:110px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--fg);padding:8px;font:12px monospace}
details summary{cursor:pointer;font-weight:500}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sm{padding:10px 12px;border:1px solid var(--line);background:var(--card);border-radius:10px;margin-top:8px}
.row .t span.nt{white-space:normal}
.ic{width:1.4em;height:1.4em;border-radius:6px;object-fit:cover;vertical-align:-.3em}
.mdl{position:fixed;inset:0;z-index:5;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:14px}.mdl[hidden]{display:none}.mdl .card{width:100%;max-width:520px;max-height:90vh;overflow:auto;margin:0}
</style>
</head>
<body>
<div id="app">
<header id="hd"><button class="ib" data-a="m" data-k="-1" aria-label="เดือนก่อน">‹</button><b id="mt"></b><button class="ib" data-a="m" data-k="1" aria-label="เดือนถัดไป">›</button></header>
<main id="v"></main>
</div>
<nav id="nav"></nav>
<div id="toast" role="status"></div>
<script>
var K='moneyapp.v1';
var G=[{id:1,n:'เงินสด',l:0,e:'💵'},{id:2,n:'เงินฝากธนาคาร',l:0,e:'🏦'},{id:3,n:'เงินออนไลน์',l:0,e:'📱'},{id:5,n:'สหกรณ์ออมทรัพย์',l:0,e:'🤝'},{id:4,n:'หนี้สิน',l:1,e:'💳'}];
function seed(){return{n:100,accs:[{id:1,n:'กระเป๋าสตางค์',g:1,i:0},{id:2,n:'บัญชีธนาคาร',g:2,i:0},{id:3,n:'บัตรเครดิต',g:4,i:0}],
cats:[[1,'รายรับจากอาชีพ','i','💼'],[2,'รายรับอื่นๆ','i','🎁'],[3,'ดอกเบี้ยเงินฝาก','i','🏦'],[4,'ใช้จ่ายในอาชีพ','e','🛠️'],[5,'ที่อยู่อาศัย','e','🏠'],[6,'อาหาร/เครื่องดื่ม','e','🍜'],[7,'เดินทาง','e','🚌'],[8,'ของใช้ประจำวัน','e','🧴'],[9,'เสื้อผ้า/แต่งกาย','e','👕'],[10,'สาธารณูปโภค','e','💡'],[11,'รักษาพยาบาล','e','💊'],[12,'สันทนาการ/สังคม','e','🎉'],[13,'ครอบครัว','e','👪'],[14,'สัตว์เลี้ยง','e','🐾'],[15,'ค่าธรรมเนียม','e','🧾'],[16,'เก็บออม','e','🐷']].map(function(c){return{id:c[0],n:c[1],t:c[2],e:c[3]}}),tx:[]}}
var S=null;try{S=JSON.parse(localStorage.getItem(K))}catch(e){}
if(!S||!S.accs||!S.cats||!S.tx)S=seed();
S.accs.forEach(function(a){if(a.g==6)a.g=5});
function save(){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}}
function $(i){return document.getElementById(i)}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
var nf=new Intl.NumberFormat('th-TH',{minimumFractionDigits:2,maximumFractionDigits:2});
function fmt(n){return nf.format(n)}
function iso(d){return new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)}
var today=iso(new Date()),ym=today.slice(0,7),view='add',ft=2,armed=0,eid=0,etx=0,dr={amt:'',dt:today,ac:'',nt:''};
function acc(i){return S.accs.filter(function(a){return a.id==i})[0]||{n:'(ไม่พบบัญชี)',g:1,i:0}}
function cat(i){return S.cats.filter(function(c){return c.id==i})[0]||{n:'(ไม่พบหมวด)',e:'•'}}
function aic(a){return a.e||G.filter(function(g){return g.id==a.g})[0].e}
function ico(o){return o.g?aic(o):o.e}
function ih(o){return o.img?'<img class="ic" alt="" src="'+o.img+'">':esc(ico(o)||'')}
var pimg,ecur;
function pv(k){var s=pimg===undefined?(ecur&&ecur.img):pimg;$(k).innerHTML=s?'<img class="ic" style="width:48px;height:48px;margin-top:8px" alt="" src="'+s+'"> <button class="x" data-a="rmimg" data-k="'+k+'">ลบรูป</button>':''}
function isL(a){return G.filter(function(g){return g.id==a.g})[0].l==1}
function bal(a){var d=0;S.tx.forEach(function(x){if(x.t==1&&x.a==a.id)d+=x.amt;else if(x.t==2&&x.a==a.id)d-=x.amt;else if(x.t==3){if(x.a==a.id)d-=x.amt;if(x.to==a.id)d+=x.amt}});return isL(a)?a.i-d:a.i+d}
function toast(m){var t=$('toast');t.textContent=m;t.className='on';clearTimeout(toast.h);toast.h=setTimeout(function(){t.className=''},1800)}
function dth(d){return new Date(d+'T00:00:00').toLocaleDateString('th-TH',{weekday:'short',day:'numeric',month:'short'})}
function opts(list,sel){return list.map(function(o){return'<option value="'+o.id+'"'+(o.id==sel?' selected':'')+'>'+esc((ico(o)?ico(o)+' ':'')+o.n)+'</option>'}).join('')}
function snap(){if($('amt'))dr={amt:$('amt').value,dt:$('dt').value,ac:$('ac').value,nt:$('nt').value}}
function vAdd(){
 if(!dr.ac)dr.ac=S.accs[0].id;
 var seg=[[2,'รายจ่าย'],[1,'รายรับ'],[3,'โอนเงิน']].map(function(p){return'<button data-a="ft" data-k="'+p[0]+'" class="'+(ft==p[0]?'on':'')+'">'+p[1]+'</button>'}).join('');
 var second=ft==3?'<label for="to">ไปยังบัญชี</label><select id="to">'+opts(S.accs,dr.to)+'</select>':'<label for="cat">หมวดหมู่</label><select id="cat">'+opts(S.cats.filter(function(c){return c.t==(ft==1?'i':'e')}),dr.cat)+'</select>';
 return'<h2>'+(etx?'แก้ไขรายการ':'บันทึกรายการ')+'</h2><div class="seg">'+seg+'</div><div class="card"><label for="amt">จำนวนเงิน (บาท)</label><input id="amt" inputmode="decimal" placeholder="0.00" value="'+esc(dr.amt)+'">'
 +'<label for="ac">'+(ft==3?'จากบัญชี':'บัญชี')+'</label><select id="ac">'+opts(S.accs,dr.ac)+'</select>'+second
 +'<label for="nt">บันทึกช่วยจำ</label><input id="nt" placeholder="เช่น ข้าวกลางวัน" value="'+esc(dr.nt)+'">'
 +'<label for="dt">วันที่</label><input id="dt" type="date" value="'+esc(dr.dt)+'"><button class="go" data-a="add">'+(etx?'บันทึกการแก้ไข':'บันทึก')+'</button>'+(etx?'<button class="sm" style="width:100%" data-a="cancel">ยกเลิก</button>':'')+'</div>'}
function monthTx(){return S.tx.filter(function(x){return x.d.slice(0,7)==ym})}
function vList(){
 var xs=monthTx().sort(function(a,b){return b.d.localeCompare(a.d)||b.id-a.id});
 if(!xs.length)return'<p class="mut">ยังไม่มีรายการในเดือนนี้ กดแท็บบันทึกเพื่อเพิ่มรายการแรก</p>';
 var h='<div class="card">',last='';
 xs.forEach(function(x){
  if(x.d!=last){last=x.d;h+='<h4>'+dth(x.d)+'</h4>'}
  var ttl=x.t==3?'🔁 โอน → '+esc(acc(x.to).n):ih(cat(x.c))+' '+esc(cat(x.c).n);
  var cls=x.t==1?'i':x.t==2?'e':'',sg=x.t==1?'+':x.t==2?'−':'';
  h+='<div class="row"><div class="t">'+ttl+'<span>'+ih(acc(x.a))+' '+esc(acc(x.a).n)+(x.n?' · '+esc(x.n):'')+'</span></div><div class="amt '+cls+'">'+sg+fmt(x.amt)+'</div><button class="x" data-a="etx" data-k="'+x.id+'" aria-label="แก้ไข">✎</button><button class="x'+(armed==x.id?' arm':'')+'" data-a="del" data-k="'+x.id+'" aria-label="ลบ">'+(armed==x.id?'ลบ?':'✕')+'</button></div>'});
 return h+'</div>'}
function vSum(){
 var inc=0,exp=0,by={};
 monthTx().forEach(function(x){if(x.t==1)inc+=x.amt;if(x.t==2){exp+=x.amt;by[x.c]=(by[x.c]||0)+x.amt}});
 var h='<h2>สรุปเดือนนี้</h2><div class="stats"><div><small>รายรับ</small><b class="i">'+fmt(inc)+'</b></div><div><small>รายจ่าย</small><b class="e">'+fmt(exp)+'</b></div><div><small>คงเหลือ</small><b class="'+(inc-exp<0?'e':'i')+'">'+fmt(inc-exp)+'</b></div></div>';
 var ks=Object.keys(by).sort(function(a,b){return by[b]-by[a]});
 h+='<h4>รายจ่ายแยกตามหมวด</h4><div class="card">';
 if(!ks.length)h+='<span class="mut">ยังไม่มีรายจ่ายในเดือนนี้</span>';
 ks.forEach(function(k){var p=Math.round(by[k]/exp*100);h+='<div style="margin:8px 0"><div class="sp"><span>'+ih(cat(k))+' '+esc(cat(k).n)+'</span><span>'+fmt(by[k])+' <span class="mut">('+p+'%)</span></span></div><div class="bar"><i style="width:'+p+'%"></i></div></div>'});
 return h+'</div>'}
function catList(){var h='';[['e','หมวดรายจ่าย'],['i','หมวดรายรับ']].forEach(function(p){h+='<h4>'+p[1]+'</h4><div class="card">';S.cats.filter(function(c){return c.t==p[0]}).forEach(function(c){h+='<div class="row"><div class="t">'+ih(c)+' '+esc(c.n)+'</div><button class="x" data-a="edit" data-k="c'+c.id+'" aria-label="แก้ไข">✎</button></div>'});h+='</div>'});return h}
function vAcc(){
 var tot=0,h='';
 G.forEach(function(g){
  var as=S.accs.filter(function(a){return a.g==g.id});if(!as.length)return;
  h+='<h4>'+g.e+' '+g.n+'</h4><div class="card">';
  as.forEach(function(a){var b=bal(a);tot+=g.l?-b:b;h+='<div class="row"><div class="t">'+ih(a)+' '+esc(a.n)+(a.note?'<span class="nt">'+esc(a.note)+'</span>':'')+'</div><div class="amt '+(g.l?'e':'')+'">'+fmt(b)+'</div><button class="x" data-a="edit" data-k="a'+a.id+'" aria-label="แก้ไข">✎</button></div>'});
  h+='</div>'});
 return'<h2>บัญชีของฉัน</h2><div class="stats" style="grid-template-columns:1fr"><div><small>ทรัพย์สินสุทธิ (ทรัพย์สิน − หนี้สิน)</small><b class="'+(tot<0?'e':'i')+'">'+fmt(tot)+'</b></div></div>'+h
 +catList()+'<div class="two"><button class="sm" data-a="open" data-k="m-acc">➕ เพิ่มบัญชี</button><button class="sm" data-a="open" data-k="m-cat">➕ เพิ่มหมวดหมู่</button></div><div class="mdl" id="m-acc" hidden><div class="card"><div class="sp"><h2 style="margin:0">เพิ่มบัญชี</h2><button class="x" data-a="close" aria-label="ปิด">✕</button></div><label for="an">ชื่อบัญชี</label><input id="an"><label for="ae">ไอคอน (อีโมจิ)</label><input id="ae" maxlength="4" placeholder="เว้นว่างเพื่อใช้ไอคอนตามประเภท"><label for="ano">บันทึกข้อความ</label><input id="ano" maxlength="200" placeholder="เช่น เลขบัญชีท้าย 1234 หรือวันครบกำหนดชำระ"><div class="two"><div><label for="ag">ประเภท</label><select id="ag">'+G.map(function(g){return'<option value="'+g.id+'">'+g.n+'</option>'}).join('')+'</select></div><div><label for="ai">ยอดตั้งต้น</label><input id="ai" inputmode="decimal" placeholder="0.00"></div></div><label for="af">หรืออัปโหลดรูป</label><input id="af" type="file" accept="image/*"><div id="ap"></div><button class="go" data-a="addacc">เพิ่มบัญชี</button></div></div>'
 +'<div class="mdl" id="m-cat" hidden><div class="card"><div class="sp"><h2 style="margin:0">เพิ่มหมวดหมู่</h2><button class="x" data-a="close" aria-label="ปิด">✕</button></div><label for="cn">ชื่อหมวด</label><input id="cn"><div class="two"><div><label for="ct">ชนิด</label><select id="ct"><option value="e">รายจ่าย</option><option value="i">รายรับ</option></select></div><div><label for="ce">ไอคอน (อีโมจิ)</label><input id="ce" maxlength="4" placeholder="🍚"></div></div><label for="cf">หรืออัปโหลดรูป</label><input id="cf" type="file" accept="image/*"><div id="cp"></div><button class="go" data-a="addcat">เพิ่มหมวด</button></div></div>'
 +'<details class="card"><summary>สำรองและกู้คืนข้อมูล</summary><p class="mut">ข้อมูลเก็บในเบราว์เซอร์เครื่องนี้ คัดลอกข้อความด้านล่างไปเก็บไว้เพื่อย้ายเครื่องหรือกันข้อมูลหาย</p><textarea id="bk" aria-label="ข้อมูลสำรอง"></textarea><div class="two"><button class="sm" data-a="exp">แสดงข้อมูลสำรอง</button><button class="sm" data-a="imp">นำเข้าข้อมูล</button></div></details>'}
function render(){pimg=undefined;ecur=null;
 $('hd').className=(view=='list'||view=='sum')?'':'off';
 $('mt').textContent=new Date(ym+'-01T00:00:00').toLocaleDateString('th-TH',{month:'long',year:'numeric'});
 $('v').innerHTML={add:vAdd,list:vList,sum:vSum,acc:vAcc}[view]();
 $('nav').innerHTML=[['add','➕','บันทึก'],['list','📋','รายการ'],['sum','📊','สรุป'],['acc','🏦','บัญชี']].map(function(p){return'<button data-a="tab" data-k="'+p[0]+'" class="'+(view==p[0]?'on':'')+'"><b>'+p[1]+'</b>'+p[2]+'</button>'}).join('')}
function act(a,k){
 if(a=='edit'){var id=+k.slice(1),m=k[0]=='a'?'m-acc':'m-cat';eid=id;
  if(k[0]=='a'){var A=acc(id);$('an').value=A.n;$('ag').value=A.g;$('ai').value=A.i;$('ae').value=A.e||'';$('ano').value=A.note||'';$(m).querySelector('h2').textContent='แก้ไขบัญชี'}
  else{var C=cat(id);$('cn').value=C.n;$('ct').value=C.t;$('ce').value=C.e;$(m).querySelector('h2').textContent='แก้ไขหมวดหมู่'}
  $(m).querySelector('.go').textContent='บันทึกการแก้ไข';ecur=k[0]=='a'?acc(id):cat(id);pv(k[0]=='a'?'ap':'cp');$(m).hidden=false}
 else if(a=='etx'){var x=S.tx.filter(function(y){return y.id==k})[0];etx=x.id;ft=x.t;dr={amt:String(x.amt),dt:x.d,ac:x.a,nt:x.n||'',cat:x.c,to:x.to};view='add';armed=0;render()}
 else if(a=='cancel'){etx=0;dr={amt:'',dt:today,ac:'',nt:''};view='list';render()}
 else if(a=='open'){eid=0;$(k).hidden=false;var f=$(k).querySelector('input');if(f)f.focus()}
 else if(a=='rmimg'){pimg='';pv(k)}
 else if(a=='close'){eid=0;render()}
 else if(a=='tab'){snap();if(etx){etx=0;dr={amt:'',dt:today,ac:'',nt:''}}view=k;armed=0;render()}
 else if(a=='ft'){snap();ft=+k;render()}
 else if(a=='m'){var y=+ym.slice(0,4),m=+ym.slice(5,7)-1+(+k),d=new Date(y,m,1);ym=iso(d).slice(0,7);armed=0;render()}
 else if(a=='del'){if(armed==k){S.tx=S.tx.filter(function(x){return x.id!=k});armed=0;save();toast('ลบรายการแล้ว')}else{armed=+k;setTimeout(function(){if(armed==k){armed=0;render()}},2500)}render()}
